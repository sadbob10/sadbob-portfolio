<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#08021e"/>
      <stop offset="100%" stop-color="#0d0520"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00e5ff"/>
      <stop offset="50%"  stop-color="#a259ff"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Aurora border -->
  <rect
    x="0.75" y="0.75"
    width="30.5" height="30.5"
    rx="6.5"
    fill="none"
    stroke="url(#grad)"
    stroke-width="1"
    opacity="0.55"
  />

  <!-- < bracket -->
  <text
    x="4" y="23"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="9"
    fill="#00e5ff"
  >&lt;</text>

  <!-- S -->
  <text
    x="11" y="24"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="16"
    fill="url(#grad)"
  >S</text>

  <!-- /> -->
  <text
    x="21" y="23"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="9"
    fill="#f72585"
  >/&gt;</text>

</svg>